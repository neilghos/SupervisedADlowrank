dataset:
  name: mvtec
  format: mvtec
  path: ./datasets/MVTec
  category: bottle
  task: segmentation
  train_batch_size: 32
  eval_batch_size: 32
  num_workers: 8
  image_size: 224
  center_crop: null
  normalization: imagenet
  transform_config:
    train: null
    eval: null
  test_split_mode: from_dir
  test_split_ratio: 0.2
  val_split_mode: same_as_test
  val_split_ratio: 0.5

model:
  name: low_rank
  rank: 50
  var_threshold: 0.0001
  score_type: l1
  project_path: ./results
  normalization_method: min_max

metrics:
  image:
    - F1Score
    - AUROC
  pixel:
    - F1Score
    - AUROC
  threshold:
    method: adaptive

project:
  seed: 42
  path: ./results

logging:
  logger: []
  log_graph: false

optimization:
  export_mode: null

trainer:
  accelerator: auto
  devices: 1
  max_epochs: 1
  enable_checkpointing: false
  enable_progress_bar: true
  num_sanity_val_steps: 0
  precision: 32
